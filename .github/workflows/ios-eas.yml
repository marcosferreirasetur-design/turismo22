name: Gerar aplicativo iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "eas.json"
      - "src/data.ts"
      - ".github/workflows/ios-eas.yml"

permissions:
  contents: read

concurrency:
  group: ios-eas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Enviar compilação iOS ao Expo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm install

      - name: Verificar conta Expo
        run: |
          eas whoami
          echo "Proprietário esperado: turismobertioga"

      - name: Criar ou conectar projeto Expo
        run: eas init --non-interactive --force

      - name: Verificar projeto remoto
        run: eas project:info

      - name: Gerar versão iOS
        run: eas build --platform ios --profile production --non-interactive --no-wait
