name: Gerar aplicativo iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Enviar compilação iOS ao Expo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm install

      - name: Gerar versão iOS
        run: eas build --platform ios --profile production --non-interactive --no-wait
