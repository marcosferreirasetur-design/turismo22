name: Publicar aplicativo Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "src/**"
      - "public/**"
      - "scripts/prepare-pwa.mjs"
      - ".github/workflows/web-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Gerar aplicativo web
        run: npx expo export --platform web --output-dir dist
      - name: Preparar instalação no iPhone
        run: |
          cp public/manifest.json public/icon.svg public/sw.js dist/
          node scripts/prepare-pwa.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
